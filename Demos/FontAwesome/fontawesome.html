<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font Awesome</title>
    <!-- Font Awesome Cloudflare CDN-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-Avb2QiuDEEvB4bZJYdft2mNjVShBftLdPG8FJ0V7irTLQ8Uo0qcPxh4Plq7G5tGm0rU+1SPhVotteLpBERwTkw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
<style>
    i{font-size: 3rem;
    color: gray;
    margin-left: 1rem;
    transition: all 1s
    }
    i:hover{
        color: darkred;
    }
   </style>

</head>
<body>
    <h1><a href="https://fontawesome.com/">Font Awesome</a></h1>
    <p>The Easy Way: include a link to a CDN. Place <a href="https://cdnjs.com/libraries/font-awesome">Cloudflare</a> link in your head section</p>

    <p>How to Use: Use an I tag that's deprecated</p>

    <i class="fa-solid fa-phone-flip"></i> <br>
    <i class="fa-solid fa-kiwi-bird"></i> <br>
    <i class="fa-solid fa-laptop"></i> <br>
    <i class="fa-solid fa-star"></i> <br>
    <i class="fa-solid fa-ring"></i> <br>
</body>
</html>
