<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexboxJCAI</title>
    <style>
        h1,h2{
            text-align: center;
        }
        #container001{
            height: 600px;
            width: 600px;
            background-color: steelblue;
            border: 4px solid black;
            margin: auto;
        }
        #container002{
            height: 600px;
            width: 600px;
            background-color: steelblue;
            border: 4px solid black;
            margin: auto;
        }
        .box{
            height: 50px;
            width: 50px;
            padding: 1rem;
            border: 1px solid black;
            background-color: lightgoldenrodyellow;
        }
        /* Justify-content and Align_Items */
        #container001{
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
        }
        #container002{
            display: flex;
            flex-direction: row;
            justify-content: flex-end;
            align-items: flex-end;
        }
    </style>
</head>
<body>
    <h1>Flexbox</h1>
    <h2>Flex-Direction</h2>
    <h2>Justify-Content</h2>
    <h2>Align-Items</h2>
    <div id="container001">
        <div class="box">Item001</div>
        <div class="box">Item002</div>
        <div class="box">Item003</div>
        <div class="box">Item004</div>
        <div class="box">Item005</div>
    </div>
    <div id="container002">
        <div class="box">Item006</div>
        <div class="box">Item007</div>
        <div class="box">Item008</div>
        <div class="box">Item009</div>
        <div class="box">Item010</div>
    </div>
</body>
</html>
